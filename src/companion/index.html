<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capaz</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="mini" class="state-idle">
      <div id="top-row">
        <div id="orb">
          <img id="avatar-img" src="./laura.png" alt="Laura" />
          <div id="orb-core"></div>
        </div>
        <div id="pill"><span id="status-text"></span></div>
      </div>
      <div id="bubble">
        <div id="bubble-header">
          <span id="label">LucIA</span>
          <span id="hint">⌃⌥ (Control+Option): nueva pregunta</span>
        </div>
        <div id="answer-text"></div>
        <div id="options-container"></div>
        <div id="debug-tokens"></div>
      </div>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
